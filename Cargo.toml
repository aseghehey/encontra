[package]
name = "herdr-search"
version = "0.1.0"
edition = "2021"
description = "Full-text search over Claude Code session logs, for herdr-chat"
license = "MIT"
publish = false

[[bin]]
name = "herdr-search"
path = "src/main.rs"

[dependencies]
anyhow = "1"
regex = "1.13.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tantivy = "0.27"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
