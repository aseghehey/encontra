[package]
name = "encontra"
version = "0.1.0"
edition = "2021"
description = "Fast full-text search over Claude Code session logs, for people and the programs and agents they use"
repository = "https://github.com/aseghehey/encontra"
keywords = ["claude-code", "search", "agents", "cli", "logs"]
categories = ["command-line-utilities", "development-tools"]
license = "MIT"
publish = false

[[bin]]
name = "encontra"
path = "src/main.rs"

[dependencies]
anyhow = "1"
regex = "1.13.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tantivy = "0.27"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
